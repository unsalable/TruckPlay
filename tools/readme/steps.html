<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .row {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 56px;
      }
      .card {
        position: relative;
        width: 318px;
        height: 380px;
        padding: 40px 32px 0;
        border-radius: 32px;
        background: linear-gradient(180deg, rgb(255 255 255 / 0.09), rgb(255 255 255 / 0.04));
        box-shadow:
          inset 0 0 0 1px rgb(255 255 255 / 0.11),
          0 24px 48px -24px rgb(0 0 0 / 0.6);
      }
      .num {
        position: absolute;
        top: 26px;
        right: 26px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 750;
        color: var(--ink-2);
        background: rgb(255 255 255 / 0.08);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12);
      }
      .tile {
        width: 104px;
        height: 104px;
        border-radius: 28px;
        display: grid;
        place-items: center;
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.35),
          0 16px 30px -10px var(--tint);
      }
      .tile svg {
        width: 56px;
        height: 56px;
        color: #fff;
      }
      .blue {
        --tint: rgb(10 132 255 / 0.7);
        background: linear-gradient(180deg, #4fa7ff, #0a6cf5);
      }
      .purple {
        --tint: rgb(175 82 222 / 0.7);
        background: linear-gradient(180deg, #c27bf0, #8e3fd6);
      }
      .orange {
        --tint: rgb(255 149 0 / 0.65);
        background: linear-gradient(180deg, #ffb340, #f57c00);
      }
      .green {
        --tint: rgb(48 209 88 / 0.65);
        background: linear-gradient(180deg, #5fe07f, #1fa94a);
      }
      h3 {
        margin-top: 34px;
        font-size: 38px;
        font-weight: 750;
        letter-spacing: -0.025em;
      }
      p {
        margin-top: 12px;
        font-size: 21px;
        font-weight: 500;
        line-height: 1.38;
        color: var(--ink-2);
      }
      p b {
        color: var(--ink);
        font-weight: 650;
      }
      .chev {
        width: 30px;
        height: 30px;
        color: var(--ink-3);
        flex: none;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="row">
        <div class="card">
          <div class="num">1</div>
          <div class="tile blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.5v11.5m0 0-4.6-4.6M12 15l4.6-4.6M4.5 20h15" />
            </svg>
          </div>
          <h3>İndir</h3>
          <p>Tek dosya:<br /><b>TruckPlay-Kurulum.exe</b></p>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7" /></svg>
        <div class="card">
          <div class="num">2</div>
          <div class="tile purple">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M7.2 4.2c0-.7.8-1.1 1.4-.7l11 7.6c.6.4.4 1.4-.3 1.5l-4.6.8 2.7 5.2c.3.5.1 1.1-.4 1.3l-1.7.9c-.5.3-1.1.1-1.3-.4l-2.7-5.2-3.2 3.3c-.5.5-1.4.2-1.4-.6z" />
            </svg>
          </div>
          <h3>Çift tıkla</h3>
          <p>Oyun kapalıyken.<br />Gerisini kurulum<br /><b>kendisi yapar.</b></p>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7" /></svg>
        <div class="card">
          <div class="num">3</div>
          <div class="tile orange">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M9.6 2.6a2.4 2.4 0 0 1 4.8 0v1.7h4.1c.7 0 1.2.5 1.2 1.2v4.1h1.7a2.4 2.4 0 0 1 0 4.8h-1.7v4.1c0 .7-.5 1.2-1.2 1.2h-4.1v-1.7a2.4 2.4 0 0 0-4.8 0v1.7H5.5c-.7 0-1.2-.5-1.2-1.2v-4.1h1.7a2.4 2.4 0 0 0 0-4.8H4.3V5.5c0-.7.5-1.2 1.2-1.2h4.1z" />
            </svg>
          </div>
          <h3>Modu aç</h3>
          <p>ETS2 › Mod Yöneticisi ›<br /><b>TruckPlay</b> (bir kere)</p>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7" /></svg>
        <div class="card">
          <div class="num">✓</div>
          <div class="tile green">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.6 5.2h10.8c.7 0 1.2.5 1.2 1.2v9.1H1.4V6.4c0-.7.5-1.2 1.2-1.2zm13.2 2.9h3.4c.5 0 .9.2 1.1.6l2.1 3.5c.1.2.2.4.2.7v3.1c0 .5-.4.9-.9.9h-.5a2.7 2.7 0 0 0-5.3 0h-.1V8.1zm1.6 1.6v3h3.6l-1.7-2.7c-.1-.2-.3-.3-.5-.3h-1.4zM1.4 16.6h2.3a2.7 2.7 0 0 1 5.3 0h4.4v.9H9a2.7 2.7 0 0 1-5.3 0H1.4v-.9zm5 3.1a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2zm12.1 0a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2z" />
            </svg>
          </div>
          <h3>Sür!</h3>
          <p>Tıra bin: ekran artık<br /><b>TruckPlay</b> 🎉</p>
        </div>
      </div>
    </div>
  </body>
</html>
