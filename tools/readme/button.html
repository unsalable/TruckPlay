<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      html,
      body {
        background: transparent;
      }
      .btn {
        position: absolute;
        left: 24px;
        top: 18px;
        right: 24px;
        bottom: 30px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 40px 0 24px;
        border-radius: 999px;
        background: linear-gradient(180deg, #3d9cff, #0a6cf5);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.4),
          inset 0 -2px 0 rgb(0 0 0 / 0.12),
          0 14px 26px -12px rgb(10 108 245 / 0.75);
      }
      .ico {
        width: 64px;
        height: 64px;
        flex: none;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgb(255 255 255 / 0.2);
      }
      .ico svg {
        width: 36px;
        height: 36px;
        color: #fff;
      }
      b {
        display: block;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }
      small {
        display: block;
        margin-top: 4px;
        font-size: 18px;
        font-weight: 600;
        color: rgb(255 255 255 / 0.82);
      }
    </style>
  </head>
  <body>
    <div class="btn">
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v11m0 0-4.4-4.4M12 15l4.4-4.4M5 20h14" />
        </svg>
      </div>
      <div>
        <b>TruckPlay'i indir</b>
        <small>Windows 10/11 · tek dosya · ücretsiz</small>
      </div>
    </div>
  </body>
</html>
