<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .copy {
        position: absolute;
        left: 92px;
        top: 112px;
        width: 560px;
      }
      .icon {
        width: 116px;
        height: 116px;
        filter: drop-shadow(0 18px 34px rgb(10 132 255 / 0.5));
      }
      h1 {
        margin-top: 36px;
        font-size: 108px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      .tag {
        margin-top: 24px;
        font-size: 36px;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1.18;
      }
      .sub {
        margin-top: 14px;
        font-size: 23px;
        font-weight: 500;
        color: var(--ink-2);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 40px;
      }
      .chip {
        padding: 11px 18px 12px;
        border-radius: 999px;
        font-size: 20px;
        font-weight: 600;
        background: rgb(255 255 255 / 0.08);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12);
      }
      .stage {
        position: absolute;
        inset: 0;
        perspective: 2400px;
      }
      .back {
        position: absolute;
        left: 915px;
        top: 70px;
        width: 620px;
        transform: rotateY(-14deg) rotateX(2deg);
        transform-origin: 100% 50%;
        opacity: 0.92;
      }
      .front {
        position: absolute;
        left: 690px;
        top: 255px;
        width: 760px;
        transform: rotateY(-14deg) rotateX(2deg) translateZ(40px);
        transform-origin: 0% 50%;
      }
      .glow {
        position: absolute;
        left: 720px;
        top: 160px;
        width: 820px;
        height: 560px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgb(10 132 255 / 0.32), transparent);
        filter: blur(40px);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="glow"></div>
      <div class="copy">
        <img class="icon" src="../../plugin/setup/truckplay.png" alt="" />
        <h1>TruckPlay</h1>
        <p class="tag">Tırının ekranı artık<br />CarPlay gibi.</p>
        <p class="sub">Euro Truck Simulator 2 için · ücretsiz · tek dosya</p>
        <div class="chips">
          <span class="chip">🗺️ Canlı harita</span>
          <span class="chip">🎵 Müzik</span>
          <span class="chip">📺 YouTube</span>
        </div>
      </div>
      <div class="stage">
        <img class="shot back" src="work/maps-light.png" alt="" />
        <img class="shot front" src="work/home-dark.png" alt="" />
      </div>
    </div>
  </body>
</html>
